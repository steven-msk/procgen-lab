[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api project(':engine')
    api "io.github.spair:imgui-java-binding:1.92.7.1"
    api "io.github.spair:imgui-java-lwjgl3:1.92.7.1"
    api "io.github.spair:imgui-java-natives-linux:1.92.7.1"
    api "io.github.spair:imgui-java-natives-macos:1.92.7.1"
    api "io.github.spair:imgui-java-natives-windows:1.92.7.1"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"

    if (enableGraalNative == 'true') {
        implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
